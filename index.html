<!-- FORGE 7.0: o herói é estático para que o LCP aconteça no primeiro paint.
     Mapa estelar e hub são preenchidos pelo módulo aditivo sem deslocamento. -->
<div class="content" id="view" role="region" aria-label="Conteúdo da página" aria-live="polite">
<div id="f7HeroRoot">
<section class="f7-hero focus-hero" aria-labelledby="f7HeroTitle">
  <div>
    <p class="f7-eyebrow">Sua missão agora · M1</p>
    <h2 id="f7HeroTitle">Peano e Aritmética</h2>
    <p>Construa domínio, uma sessão por vez. Cada aula concluída vira evidência no mapa e cartão no radar SM-2.</p>
    <div class="f7-hero-actions">
      <button type="button" data-f7-action="continue">▶ Continuar estudando</button>
      <button type="button" data-f7-action="goto" data-page="porque">O porquê de tudo</button>
      <button type="button" data-f7-action="goto" data-page="protocol">Protocolo de estudo</button>
    </div>
  </div>
  <div class="f7-hero-ring" data-value="0%" style="--f7-progress:0" role="img" aria-label="Progresso geral: 0%">
    <svg viewBox="0 0 92 92" aria-hidden="true" focusable="false">
      <circle class="f7-ring-track" cx="46" cy="46" r="40"></circle>
      <circle class="f7-ring-value" cx="46" cy="46" r="40"></circle>
    </svg>
  </div>
</section>
